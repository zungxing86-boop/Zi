name: Validate Vite website

on:
  push:
    branches: [main, feature/android-apk]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
